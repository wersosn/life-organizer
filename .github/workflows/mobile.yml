name: Mobile CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  build-mobile:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Mobile/LifeOrganizerMobile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Expo check
        run: npx expo-doctor